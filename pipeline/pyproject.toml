[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rajkot-bake"
version = "0.1.0"
description = "Offline data bake for Rangilu Rajkot: OSM/Overture/DEM -> world facts"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "osmium==4.3.1",
  "shapely==2.2.0",
  "geopandas==1.2.0",
  "pyproj==3.8.0",
  "pyarrow==26.0.0",
  "duckdb==1.5.6",
  "rasterio==1.5.2",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "networkx==3.7",
  "mapbox-earcut==2.1.0",
  "PyYAML==6.0.3",
  "overturemaps==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["rajkot_bake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
