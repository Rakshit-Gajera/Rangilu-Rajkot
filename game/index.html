<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1917" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Rangilu Rajkot: the whole of Rajkot, 1:1, in your browser. Ride, explore and live a day in the city." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Rangilu Rajkot</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" hidden>
    <canvas id="minimap" width="220" height="220"></canvas>
    <div id="area"></div>
    <div id="clock"></div>
    <div id="money"></div>
    <div id="speed"></div>
    <div id="prompt"></div>
    <div id="help">E get on/off · H horn · M map · J activities · L discoveries · Tab sandbox · P photo · Esc menu</div>
    <pre id="perf" hidden></pre>
  </div>
  <div id="loading">
    <h1>Rangilu Rajkot <span lang="gu">રંગીલું રાજકોટ</span></h1>
    <p id="loading-fact"></p>
    <div class="bar"><i id="loading-bar"></i></div>
    <p id="loading-status">Loading…</p>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
