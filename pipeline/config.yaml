# Rangilu Rajkot bake configuration. Distances in metres, angles in degrees.

fetch:
  # Raw-data bbox (lon_min, lat_min, lon_max, lat_max). Wider than the playable
  # area so it covers the Darshan University corridor and the horizon ring.
  bbox: [70.60, 22.10, 71.00, 22.55]
  sources:
    osm:
      url: https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf
      file: osm/western-zone-latest.osm.pbf
    dem:
      url: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N22_00_E070_00_DEM/Copernicus_DSM_COG_10_N22_00_E070_00_DEM.tif
      file: dem/Copernicus_DSM_COG_10_N22_00_E070_00_DEM.tif
    overture_buildings:
      file: overture/overture_buildings.parquet
      type: building
    overture_places:
      file: overture/overture_places.parquet
      type: place
    ghsl_height:
      url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_H_GLOBE_R2023A/GHS_BUILT_H_ANBH_E2018_GLOBE_R2023A_4326_3ss/V1-0/tiles/GHS_BUILT_H_ANBH_E2018_GLOBE_R2023A_4326_3ss_V1_0_R7_C26.zip
      file: ghsl/anbh_R7_C26.zip

crs: "EPSG:32642"   # UTM zone 42N

world:
  # Origin near Trikon Baug (PROMPT §7.1). Trikon Baug is not in OSM; point from
  # Overture places "Trikonbaug Ka Raja" (meta). Confidence: medium. See refs/SOURCES.md.
  origin:
    lonlat: [70.80185, 22.29487]
    source: "Overture places: Trikonbaug Ka Raja"
  y_offset: 100.0           # y = elevation - y_offset
  # No RMC polygon in OSM/Overture -> city core = these OSM urban talukas
  # + OSM place=city polygon + dense built-up area (DECISIONS.md).
  urban_talukas: ["Rajkot East Taluka", "Rajkot West Taluka", "Rajkot South Taluka"]
  builtup:
    cell: 200.0             # grid cell size
    min_cover: 0.08         # building footprint share that counts as built-up
    closing: 2              # morphological closing iterations (cells)
    max_distance: 10000.0   # built-up area counts only within this radius of the origin
  rmc_buffer: 1500.0        # playable = city core + this buffer
  # Lakes pinned to OSM water polygons; the point is the Overture place that identified it
  # (refs/SOURCES.md). Aji-1 is mapped twice in OSM (w132973447 and r1786289).
  lakes:
    Aji-1: {osm: w132973447, point: [70.83608, 22.27047]}
    Nyari-1: {osm: r1917301, point: [70.70801, 22.24772]}
    Lalpari: {osm: r1786283, point: [70.83456, 22.31345]}
    Randarda: {osm: r1786286, point: [70.84485, 22.29339]}
  lake_buffer: 200.0
  # Extra playable areas beyond the city (PROMPT §0.1 item 5).
  extras:
    - name: "Darshan University"
      lonlat: [70.7831, 22.4411]  # from Rakshit (Google search); matches campus footprints, 183 m from the highway
      buffer: 600.0
      corridor_road: "Morbi"
      corridor_width: 300.0
  horizon_ring: 3000.0
  tile_size: 500.0

buildings:
  min_area: 12.0
  simplify_tolerance: 0.4
  square_angle_tolerance: 8.0
  giant_area: 20000.0
  iou_match: 0.5
  frontage_distance: 8.0

heights:
  floor_height: 3.1
  shop_ground_floor: [3.6, 4.2]
  parapet: [0.9, 1.1]
  clamp: [3.0, 100.0]
  review_above: 60.0
  # Max floors for estimated heights per style zone (old city 2-4, heritage 1-3, industrial and outskirts 1-2).
  zone_max_levels: {1: 4, 2: 3, 6: 2, 7: 3}

qa:
  # Checks allowed to fail without failing the bake, with the reason (DECISIONS.md).
  waivers:
    landmarks_located: "P0: six landmarks need positions from Rakshit"

tiler:
  only_slice: true            # P1: encode only the vertical-slice tiles
  slice: [-2000, 1000, -500, 1500]   # x_min, x_max, n_min, n_max (m from origin)
  spawn: {x: -1067, n: 473, heading: 0}   # Race Course Ring Road (PROMPT §3.1)
